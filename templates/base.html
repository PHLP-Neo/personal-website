{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="{% block meta_description %}Neo Ni's portfolio covering backend development, cloud infrastructure, web applications and data projects.{% endblock %}">

    <meta name="robots" content="{% block robots %}index, follow{% endblock %}">

    <title>
        {% block title %}Neo Ni | Backend, Cloud &amp; Data Developer{% endblock %}
    </title>

    <link rel="canonical" href="{{ canonical_url }}">

    <meta property="og:site_name" content="Neo Ni">
    <meta property="og:type" content="{% block og_type %}website{% endblock %}">
    <meta property="og:title" content="{% block og_title %}Neo Ni | Backend, Cloud &amp; Data Developer{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Neo Ni's portfolio covering backend development, cloud infrastructure, web applications and data projects.{% endblock %}">
    <meta property="og:url" content="{{ canonical_url }}">
    {% block social_image %}{% endblock %}

    <meta name="twitter:card" content="{% block twitter_card %}summary{% endblock %}">
    <meta name="twitter:title" content="{% block twitter_title %}Neo Ni | Backend, Cloud &amp; Data Developer{% endblock %}">
    <meta name="twitter:description" content="{% block twitter_description %}Neo Ni's portfolio covering backend development, cloud infrastructure, web applications and data projects.{% endblock %}">

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@graph": [
            {
                "@type": "Person",
                "@id": "{{ site_url }}/#person",
                "name": "Neo Ni",
                "url": "{{ site_url }}/",
                "sameAs": [
                    "https://github.com/PHLP-Neo",
                    "https://www.linkedin.com/in/neo-ni-3a14b6301"
                ],
                "knowsAbout": [
                    "Backend development",
                    "Cloud infrastructure",
                    "Web development",
                    "Data analysis"
                ]
            },
            {
                "@type": "WebSite",
                "@id": "{{ site_url }}/#website",
                "url": "{{ site_url }}/",
                "name": "Neo Ni",
                "description": "Neo Ni's portfolio covering backend development, cloud infrastructure, web applications and data projects.",
                "publisher": {
                    "@id": "{{ site_url }}/#person"
                }
            }
        ]
    }
    </script>

    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'images/favicon.png' %}">
    
    <link rel="apple-touch-icon" href="{% static 'images/favicon.png' %}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>

<body class="d-flex flex-column min-vh-100">
    {% include "partials/navbar.html" %}

    <main class="flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>

    {% include "partials/footer.html" %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
