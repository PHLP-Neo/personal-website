<header class="site-header">
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'core:home' %}">
                Neo
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation"
                aria-controls="mainNavigation" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNavigation">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}"
                        href="{% url 'core:home' %}">
                        Home
                    </a>

                    <a class="nav-link {% if request.resolver_match.url_name == 'about' %}active{% endif %}"
                        href="{% url 'core:about' %}">
                        About
                    </a>

                    <a class="nav-link {% if request.resolver_match.url_name == 'projects' %}active{% endif %}"
                        href="{% url 'projects:list' %}">
                        Projects
                    </a>

                    <a class="nav-link
                        {% if request.resolver_match.app_name == 'notes' %}
                            active
                        {% endif %}" href="{% url 'notes:list' %}">
                        Notes
                    </a>

                    <a class="nav-link
                        {% if request.resolver_match.app_name == 'contact' %}
                            active
                        {% endif %}" href="{% url 'contact:contact' %}">
                        Contact
                    </a>
                </div>
            </div>
        </div>
    </nav>
</header>
